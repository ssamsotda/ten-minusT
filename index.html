<title>수업용 십에서 빼기 연산판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Serif+KR:wght@900&display=swap">
<style>
/* 레이아웃: 위 안내 줄 → 왼쪽 손글씨 풀이판 / 오른쪽 십배열판 + 숫자 키패드 */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --ink:#1B2559; --muted:#5B6490; --line:#D9DEEF;
  --coral:#E4503F; --coral-ink:#FFFFFF; --gold:#F4B63D; --pink:#E8368F; --red:#D93636;
  --green:#1F8F5A; --tan:#D6B692; --hl:#FCCDE6; --mint-tint:#D3F0E1;
  --t-blue:#2F62D9; --t-gold:#E58A00; --d-blue:#4C7DF0; --d-gold:#F4A21E; --d-pink:#EB5FA6; --d-mint:#3DB383; --d-green:#1F9D63; --d-empty:#EEF1FA;
  --f-ui:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-head:'Jua','Gowun Dodum','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Noto Serif KR','Nanum Myeongjo','Batang',Georgia,serif;
  --f-hand:'Jua','Gowun Dodum','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1535; --surface:#19214F; --ink:#EEF1FF; --muted:#A3ABD6; --line:#2C3772;
    --coral:#FF7B6B; --coral-ink:#1B1030; --gold:#F7C45C; --pink:#FF5CB1; --red:#FF7C7C;
    --green:#5ADBA0; --tan:#B8946F; --hl:#6E2A58; --mint-tint:#1E5A47;
    --t-blue:#8DB0FF; --t-gold:#FFC04D; --d-blue:#6E97FF; --d-gold:#F7B53A; --d-pink:#FF7FBD; --d-mint:#55D19C; --d-green:#3FCB85; --d-empty:#232C63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1535; --surface:#19214F; --ink:#EEF1FF; --muted:#A3ABD6; --line:#2C3772;
  --coral:#FF7B6B; --coral-ink:#1B1030; --gold:#F7C45C; --pink:#FF5CB1; --red:#FF7C7C;
  --green:#5ADBA0; --tan:#B8946F; --hl:#6E2A58; --mint-tint:#1E5A47;
  --t-blue:#8DB0FF; --t-gold:#FFC04D; --d-blue:#6E97FF; --d-gold:#F7B53A; --d-pink:#FF7FBD; --d-mint:#55D19C; --d-green:#3FCB85; --d-empty:#232C63;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:16px; line-height:1.5;
  padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1120px; margin:0 auto; display:grid; gap:14px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.brand small{display:block; color:var(--muted); font-size:14px; letter-spacing:.04em}
.brand h1{margin:0; font-family:var(--f-head); font-weight:400; font-size:clamp(26px,4vw,36px); line-height:1.15; text-wrap:balance}
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:9px 18px; font-family:var(--f-head); font-size:18px; min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.btn{border:2px solid var(--ink); background:var(--surface); border-radius:12px; padding:8px 16px; min-height:44px; font-family:var(--f-head); font-size:17px}
.btn.primary{background:var(--coral); border-color:var(--coral); color:var(--coral-ink)}
.btn.pulse{animation:nudge 1.1s ease-in-out infinite}
.score{color:var(--muted); font-size:15px; white-space:nowrap}

.ask{display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 18px}
.ask .step{font-family:var(--f-head); background:var(--gold); color:#1B2559; border-radius:999px; padding:4px 14px; font-size:16px; white-space:nowrap}
.ask .q{flex:1 1 280px; min-width:0; margin:0; font-family:var(--f-head); font-size:clamp(21px,3.2vw,30px); line-height:1.3; text-wrap:balance}
.ask .tools{display:flex; gap:8px}
.ask .tools .btn{font-size:15px; padding:6px 12px; min-height:40px}
.fb{min-height:1.6em; margin:-4px 4px 0; font-size:17px}
.fb:empty{display:none}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)} .fb.warn{color:var(--muted)}

.layout{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr); gap:14px; align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
:root{--mode:#2F6BFF}
:root[data-mode="back"]{--mode:#9B3FD6}
.card{position:relative; background:color-mix(in srgb, var(--mode) 7%, var(--surface)); border:3px solid color-mix(in srgb, var(--mode) 55%, var(--line)); border-radius:16px; padding:10px}
.modechip{position:absolute; left:12px; top:8px; z-index:2; padding:3px 14px; border-radius:999px; background:var(--mode); color:#fff; font-family:var(--f-head); font-size:17px; line-height:1.4}
#mFront[aria-pressed="true"]{background:#2F6BFF; color:#fff}
#mBack[aria-pressed="true"]{background:#9B3FD6; color:#fff}
.seg{border-color:var(--mode)}
.side{display:grid; gap:14px; min-width:0}

.boardcol{display:grid; gap:12px; min-width:0}
.nextrow{display:flex; justify-content:flex-end}
.btn.big{min-height:60px; padding:10px 32px; font-size:26px; border-radius:16px}
/* 풀이판 SVG */
#board{display:block; width:100%; height:auto; max-height:80vh; margin:0 auto}
#board text{font-kerning:none}
.serif{font-family:var(--f-num); font-weight:900; fill:var(--ink)}
.big{font-size:132px} .mid{font-size:104px} .fin-text{font-size:80px}
.hand{font-family:var(--f-hand); font-weight:400; fill:var(--red); stroke:var(--red); stroke-width:2.5px; stroke-linejoin:round; paint-order:stroke; font-size:66px}
.hl{fill:var(--hl)}
.arrows line{stroke:var(--pink); stroke-width:7; stroke-linecap:round}
.pinkfill{fill:var(--pink)}
.arrows{animation:fadein .9s .15s both}
.loop{fill:none; stroke:var(--red); stroke-width:6; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset 1.1s ease}
.loop.on{stroke-dashoffset:0}
.row{opacity:0; transition:opacity .5s; pointer-events:none}
.row.on{opacity:1}
.slot .box{fill:var(--surface); stroke:var(--tan); stroke-width:6}
.slot.tint-pink .box{fill:var(--hl)}
.slot.tint-mint .box{fill:var(--mint-tint)}
.slot .glow{fill:none; stroke:var(--gold); stroke-width:10; opacity:0}
.slot.active .glow{opacity:1; animation:glow 1.3s ease-in-out infinite}
.slot .val{font-family:var(--f-hand); font-weight:400; font-size:66px; fill:var(--red); stroke:var(--red); stroke-width:2.5px; stroke-linejoin:round; paint-order:stroke; text-anchor:middle}
.slot .val.ph{fill:var(--muted); stroke:none; opacity:.45; font-family:var(--f-ui); font-size:44px}
.slot.fin .val{font-family:var(--f-num); font-weight:900; font-size:60px; fill:var(--green); stroke:var(--green); stroke-width:1.5px}
.slot.fin .val.ph{font-family:var(--f-ui); font-weight:400; font-size:44px; fill:var(--muted); stroke:none}
.slot.txt-blue .val:not(.ph){fill:var(--t-blue); stroke:var(--t-blue)}
.slot.txt-gold .val:not(.ph){fill:var(--t-gold); stroke:var(--t-gold)}
.hand.t-gold{fill:var(--t-gold); stroke:var(--t-gold)}
.slot.shake .inner{animation:shake .4s}

/* 십배열판 */
#frames{display:block; width:100%; height:auto; max-height:34vh; margin:0 auto}
.frame{fill:var(--d-empty); stroke:var(--ink); stroke-width:4}
.gridline{stroke:var(--line); stroke-width:2}
.dot{transition:fill .45s}
.dot.blink{animation:dotblink 1s ease-in-out infinite}
@keyframes dotblink{0%,100%{opacity:1}50%{opacity:.25}}
.d-blue{fill:var(--d-blue)} .d-gold{fill:var(--d-gold)} .d-pink{fill:var(--d-pink)} .d-mint{fill:var(--d-mint)} .d-green{fill:var(--d-green)}
.xmark{opacity:0; transition:opacity .35s; pointer-events:none}
#frames.pick{touch-action:none; user-select:none; -webkit-user-select:none}
.pick .dot.pickable{cursor:pointer; stroke:transparent; stroke-width:6}
.pick .dot.pickable:hover{stroke:var(--gold)}
.xmark.on{opacity:1}
.xmark circle{fill:var(--surface); stroke:var(--line); stroke-width:5}
.xmark line{stroke:var(--red); stroke-width:6; stroke-linecap:round}

/* 키패드 */
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pad button{border:2px solid var(--ink); background:var(--surface); border-radius:14px; min-height:52px; font-family:var(--f-num); font-weight:900; font-size:28px; color:var(--ink)}
.pad button:active{transform:translateY(1px)}
.pad .go{background:var(--coral); border-color:var(--coral); color:var(--coral-ink); font-family:var(--f-head); font-weight:400; font-size:24px}
.pad .del{font-family:var(--f-ui); font-weight:400; font-size:22px}
.pad[data-off="1"] button{opacity:.45; pointer-events:none}


.progress{display:flex; align-items:center; gap:10px}
.pips{display:inline-flex; flex-wrap:wrap; gap:5px}
.pip{display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); background:transparent}
.pip.d.m-front{background:#2F6BFF; border-color:#2F6BFF}
.pip.d.m-back{background:#9B3FD6; border-color:#9B3FD6}
.pip.c{border-color:var(--mode); background:color-mix(in srgb, var(--mode) 25%, var(--surface)); box-shadow:0 0 0 2px color-mix(in srgb, var(--mode) 35%, transparent)}
.calc{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:2px solid var(--mode); border-radius:16px; background:var(--surface)}
.calc input{width:76px; height:48px; text-align:center; font-family:var(--f-num); font-weight:900; font-size:28px; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:12px; -moz-appearance:textfield}
.calc input::-webkit-outer-spin-button,.calc input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.calc .minus{font-family:var(--f-num); font-weight:900; font-size:30px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.cele{position:fixed; inset:0; z-index:50; display:grid; place-items:center; overflow:hidden; background:rgba(12,18,52,.66);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cele-card{position:relative; z-index:1; width:min(100%,420px); text-align:center; background:var(--surface); border:4px solid var(--gold); border-radius:24px; padding:22px 24px 24px; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.cele-card h2{margin:4px 0 2px; font-family:var(--f-head); font-weight:400; font-size:clamp(34px,8vw,46px); line-height:1.15; color:var(--coral)}
.cele-card p{margin:0 0 16px; color:var(--muted); font-size:18px}
.stamp{display:block; width:min(60vw,200px); height:auto; margin:0 auto; animation:stampin .7s .25s cubic-bezier(.2,1.6,.4,1) both}
.sums{display:grid; gap:8px; margin:0 0 18px}
.sum{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 16px; border-radius:14px; color:#fff; font-family:var(--f-head); font-size:20px}
.sum b{font-weight:400; font-size:28px; line-height:1}
.sum.f{background:#2F6BFF}
.sum.b{background:#9B3FD6}
.cele-btns{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.confetti-box{position:absolute; inset:0; pointer-events:none}
.confetti{position:absolute; top:-24px; width:10px; height:16px; border-radius:2px; animation:fall 3.4s linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@keyframes pop{from{transform:scale(.7); opacity:0}to{transform:scale(1); opacity:1}}
@keyframes stampin{from{transform:scale(2.2) rotate(-18deg); opacity:0}to{transform:scale(1) rotate(0); opacity:1}}
.pickhint{display:none; pointer-events:none}
.pickhint.on{display:block}
.ph-anim{animation:hint .9s ease-in-out infinite}
.ph-arrow{fill:var(--coral); stroke:var(--surface); stroke-width:3; stroke-linejoin:round}
.ph-arrow.red{fill:var(--red)}
.ph-text.red.mt{font-size:42px; stroke-width:9; font-weight:400}
.ph-text.red{fill:var(--red); font-size:26px}
.ph-text{font-family:var(--f-head); font-size:30px; fill:var(--coral); paint-order:stroke; stroke:var(--surface); stroke-width:6}
@keyframes hint{0%,100%{opacity:1; transform:translateY(0)}50%{opacity:.15; transform:translateY(10px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){
  .confetti{display:none}
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <small>쌤솟다</small>
      <h1>수업용 십에서 빼기 연산판</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="가르기 방법">
        <button type="button" id="mFront" aria-pressed="true">앞의 수 가르기</button>
        <button type="button" id="mBack" aria-pressed="false">뒤의 수 가르기</button>
      </div>
      <button type="button" class="btn" id="sound" aria-pressed="true">소리 켜짐</button>
      <div class="calc" id="calc" role="group" aria-label="계산할 식 입력">
        <input id="inA" type="number" inputmode="numeric" min="11" max="18" aria-label="앞의 수" value="13">
        <span class="minus" aria-hidden="true">−</span>
        <input id="inB" type="number" inputmode="numeric" min="2" max="9" aria-label="뒤의 수" value="8">
        <button type="button" class="btn primary" id="apply">풀어 보기</button>
      </div>
    </div>
  </header>

  <div class="fb" id="fb" role="status"></div>

  <div class="layout">
    <div class="boardcol">
      <div class="card"><div class="modechip" id="modeChip"></div><svg id="board" viewBox="0 0 640 640" role="img" aria-label="손글씨 풀이판"></svg></div>
      <div class="nextrow"><button type="button" class="btn big" id="next">처음부터 다시</button></div>
    </div>
    <div class="side">
      <div class="card"><svg id="frames" viewBox="0 -84 440 494" role="img" aria-label="십배열판"></svg></div>
      <div class="pad" id="pad" aria-label="숫자 키패드">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" class="del" data-k="del" aria-label="지우기">지우기</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="go" data-k="go">확인</button>
      </div>
    </div>
  </div>

</div>

<div class="cele" id="cele" hidden role="dialog" aria-modal="true" aria-labelledby="celeT">
  <div class="confetti-box" id="confetti" aria-hidden="true"></div>
  <div class="cele-card">
    <svg class="stamp" viewBox="0 0 200 200" aria-hidden="true">
      <g transform="rotate(-8 100 100)">
        <circle cx="100" cy="100" r="88" fill="none" stroke="var(--red)" stroke-width="7"/>
        <circle cx="100" cy="100" r="76" fill="none" stroke="var(--red)" stroke-width="2.5"/>
        <polygon points="100,26 108,48 132,49 113,64 120,87 100,74 80,87 87,64 68,49 92,48" fill="var(--gold)" stroke="var(--red)" stroke-width="2"/>
        <text x="100" y="123" text-anchor="middle" style="font-family:var(--f-head)" font-size="24" fill="var(--red)">참 잘했어요</text>
        <text x="100" y="153" text-anchor="middle" style="font-family:var(--f-head)" font-size="17" fill="var(--red)">7문제 완성</text>
      </g>
    </svg>
    <h2 id="celeT">참 잘했어요!</h2>
    <p>7문제를 모두 풀었어요.</p>
    <div class="sums" id="celeSum"></div>
    <div class="cele-btns">
      <button type="button" class="btn" id="celeAgain">음악 다시 듣기</button>
      <button type="button" class="btn primary" id="celeNew">새 7문제</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var NS = 'http://www.w3.org/2000/svg';
  var st = { mode:'front', a:14, b:5, cur:0, buf:'', wrong:0, vals:{}, removed:{}, removed2:{}, doneMode:[], round:[], idx:0, done:[] };
  var ROUND = 7, muted = false, ac = null;
  var okWords = ['맞아요!','잘했어요!','좋아요!','정확해요!'];
  var okIdx = 0;

  function P(){
    var c = st.a - 10;
    if(st.mode === 'front'){ var r = 10 - st.b; return { c:c, r:r, ans:r + c }; }
    var d = st.b - c; return { c:c, d:d, ans:10 - d };
  }
  // 숫자 읽기 끝소리(일·삼·육·칠·팔·영/십)에 받침이 있으면 을/과/이, 없으면 를/와/가
  function bat(n){ return [0,1,3,6,7,8].indexOf(n % 10) >= 0; }
  function O(n){ return n + (bat(n) ? '을' : '를'); }
  function W(n){ return n + (bat(n) ? '과' : '와'); }
  function G(n){ return n + (bat(n) ? '이' : '가'); }
  function steps(){
    var a = st.a, b = st.b, p = P();
    if(st.mode === 'front') return [
      { k:'t',  ans:10,    q:O(a) + ' 가를 때 왼쪽에 쓸 10을 먼저 써 볼까요?', h:'첫째 판에 점이 몇 개 가득 차 있는지 세어 보세요.' },
      { k:'c',  ans:p.c,   q:'10과 몇을 합치면 ' + G(a) + ' 될까요?',   h:'십배열판에서 둘째 판의 점이 몇 개인지 세어 보세요.' },
      { k:'r1', ans:p.r,   q:'파란 점 ' + b + '개를 눌러 지우고, 남은 점의 수를 아랫줄 첫 칸에 써 볼까요?',    h:'첫째 판의 파란 점 ' + b + '개를 누르거나 끌면 X가 돼요. 남은 점을 세어 보세요.' },
      { k:'r2', ans:p.ans, q:'남은 ' + W(p.r) + ' ' + O(p.c) + ' 더한 값을 = 뒤 칸에 써 볼까요?', h:p.r + '에서 ' + p.c + '만큼 이어서 세어 보세요.' },
      { k:'fin',ans:p.ans, q:a + ' − ' + b + '의 답을 아래 상자에 써 볼까요?', h:'방금 구한 ' + p.r + ' + ' + p.c + '의 답이에요.' }
    ];
    return [
      { k:'c',  ans:p.c,   q:a + '에서 얼마를 빼면 10이 될까요?',        h:'둘째 판의 점이 몇 개인지 세어 보세요.' },
      { k:'d',  ans:p.d,   q:O(b) + ' ' + W(p.c) + ' 몇으로 가를까요?',  h:b + '에서 ' + O(p.c) + ' 빼면 남는 수예요.' },

        var t = t0 + (b * 8 + k) * e, m = mel[b][k];
        if(b === 7 && k === 0){                                        // 마지막 마디: 으뜸화음을 길게
          [72, 76, 79, 84].forEach(function(mm, idx){ note(c, master, t, e * 7, mm, 'triangle', idx === 3 ? 0.30 : 0.16); });
          note(c, master, t, e * 7, 48, 'triangle', 0.34);
        } else if(m){
          note(c, master, t, e * 0.95, m, 'triangle', 0.28);
          note(c, master, t, e * 0.6, m + 12, 'square', 0.035);
        }
        if(b < 7){
          if(k === 0 || k === 4) note(c, master, t, e * 3.6, bass[b][k / 4], 'triangle', 0.30);
          var s2 = c.createBufferSource(), hg = c.createGain(), hf = c.createBiquadFilter();
          s2.buffer = hat; hf.type = 'highpass'; hf.frequency.value = 6500; hg.gain.value = (k % 2 ? 0.10 : 0.18);
          s2.connect(hf); hf.connect(hg); hg.connect(master); s2.start(t);
          if(k === 0 || k === 4){                                      // 쿵
            var ko = c.createOscillator(), kg = c.createGain();
            ko.frequency.setValueAtTime(130, t); ko.frequency.exponentialRampToValueAtTime(42, t + 0.12);
            kg.gain.setValueAtTime(0.5, t); kg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
            ko.connect(kg); kg.connect(master); ko.start(t); ko.stop(t + 0.18);
          }
        }
      }
    }
  }
  function buildConfetti(){
    var cols = ['--d-pink','--d-gold','--d-blue','--d-mint','--coral'], h = '';
    for(var i = 0; i < 34; i++){
      h += '<span class="confetti" style="left:' + (Math.random() * 100).toFixed(1) + '%;background:var(' + cols[i % cols.length] + ');' +
           'animation-delay:-' + (Math.random() * 3.4).toFixed(2) + 's;animation-duration:' + (2.6 + Math.random() * 1.8).toFixed(2) + 's"></span>';
    }
    $('#confetti').innerHTML = h;
  }
  function celebrate(){
    var nf = 0, nb = 0;
    for(var q = 0; q < ROUND; q++){ if(st.done[q]){ if(st.doneMode[q] === 'back') nb++; else nf++; } }
    $('#celeSum').innerHTML = '<div class="sum f"><span>앞의 수 가르기</span><span><b>' + nf + '</b> 문제 성공</span></div>' +
                              '<div class="sum b"><span>뒤의 수 가르기</span><span><b>' + nb + '</b> 문제 성공</span></div>';
    buildConfetti();
    $('#cele').hidden = false;
    music();
    $('#celeNew').focus();
  }
  function hideCele(){ $('#cele').hidden = true; stopMusic(); }

  // 점을 누르거나, 누른 채 끌어서 여러 개를 한 번에 지운다(처음 누른 점이 X면 되돌리기)
  var fr = $('#frames'), last = null;
  fr.addEventListener('pointerdown', function(e){
    var t = e.target.closest('.dot'); if(!t || !pickMode()) return;
    e.preventDefault();
    var i = parseInt(t.getAttribute('data-i'), 10);
    drag = store()[i] ? 'del' : 'add'; dragWarned = false; last = [e.clientX, e.clientY];
    try{ fr.setPointerCapture(e.pointerId); }catch(err){}
    pick(i, drag, false);
  });
  fr.addEventListener('pointermove', function(e){
    if(!drag || !last) return;
    var dx = e.clientX - last[0], dy = e.clientY - last[1];
    var steps = Math.max(1, Math.ceil(Math.sqrt(dx * dx + dy * dy) / 10));
    for(var k = 1; k <= steps; k++){
      var i = dotAt(last[0] + dx * k / steps, last[1] + dy * k / steps);
      if(i >= 0) pick(i, drag, true);
    }
    last = [e.clientX, e.clientY];
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function(ev){
    fr.addEventListener(ev, function(){ drag = null; last = null; });
  });
  $('#pad').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(btn) press(btn.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function(e){
    if(!$('#cele').hidden){ if(e.key === 'Escape') hideCele(); return; }
    if(e.target && e.target.tagName === 'INPUT') return;
    if(e.key >= '0' && e.key <= '9') press(e.key);
    else if(e.key === 'Backspace') press('del');
    else if(e.key === 'Enter'){
      if(st.cur >= steps().length) e.preventDefault(); else press('go');
    }
  });
  $('#next').addEventListener('click', function(){
    sfx('next');
    if(st.cur >= steps().length){ var f = $('#inA'); f.focus(); f.select(); }
    else start(st.a, st.b);
  });
  $('#sound').addEventListener('click', function(){
    muted = !muted;
    this.setAttribute('aria-pressed', String(!muted)); this.textContent = muted ? '소리 꺼짐' : '소리 켜짐';
    if(muted) stopMusic(); else { audio(); sfx('pop'); }
  });
  $('#celeAgain').addEventListener('click', music);
  $('#celeNew').addEventListener('click', function(){ newRound(); });
  ['pointerdown', 'keydown'].forEach(function(ev){ document.addEventListener(ev, audio, { once:true }); });
  $('#mFront').addEventListener('click', function(){ start(st.a, st.b, 'front'); });
  $('#mBack').addEventListener('click', function(){ start(st.a, st.b, 'back'); });

  // 선생님이 입력한 식으로 시작
  function applyInput(){
    var a = parseInt($('#inA').value, 10), b = parseInt($('#inB').value, 10);
    if(!(a >= 11 && a <= 18) || !(b >= 2 && b <= 9)){ msg('앞의 수는 11~18, 뒤의 수는 2~9로 넣어 주세요.', 'bad'); return; }
    if(b <= a - 10){ msg(a + ' − ' + b + ' 식은 받아내림이 필요 없어요. 낱개보다 큰 수를 빼는 식을 넣어 주세요. (예: 13 − 8)', 'bad'); return; }
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    start(a, b, st.mode);
  }
  $('#apply').addEventListener('click', applyInput);
  ['#inA', '#inB'].forEach(function(q){ $(q).addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); applyInput(); } }); });
  applyInput();
})();
</script>
